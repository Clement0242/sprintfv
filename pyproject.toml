[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sprintfv"
version = "0.1.0"
description = "Sprint acceleration and force-velocity profiling: radar, timing gates and GPS/LPS tracking (Samozino method, in-situ profiles, Kalman filtering)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clément Verdier" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
keywords = ["sport science", "sprint", "force-velocity", "biomechanics", "GPS", "LPS", "Kalman filter"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
report = ["matplotlib>=3.7", "jinja2>=3.1", "weasyprint>=60"]
test = ["pytest>=7", "filterpy>=1.4", "matplotlib>=3.7", "jinja2>=3.1", "weasyprint>=60"]

[project.scripts]
sprintfv = "sprintfv.cli:main"

[project.urls]
Homepage = "https://github.com/Clement0242/sprintfv"

[tool.hatch.build.targets.wheel]
packages = ["src/sprintfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
